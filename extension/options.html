<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Is This AI? Settings</title>
  <link rel="stylesheet" href="ui/report.css">
  <style>
    body { max-width: 560px; margin: 32px auto; padding: 0 16px; }
    label { display: block; font-weight: 600; margin: 18px 0 6px; }
    .row { display: flex; gap: 8px; } .row input { flex: 1; }
    #msg { margin-top: 10px; min-height: 1.5em; }
  </style>
</head>
<body>
  <header class="iti-top"><img class="iti-logo" src="icons/icon48.png" alt=""><h1>Is This AI? Settings</h1></header>
  <div class="iti-card">
    <label for="backend">Checker (backend) address</label>
    <div class="row">
      <input id="backend" class="iti-field" type="url" spellcheck="false">
      <button id="save" class="iti-btn">Save &amp; test</button>
    </div>
    <p id="msg" class="iti-status" role="status"></p>
    <p class="iti-hint">Default is <code>http://localhost:8787</code>, the backend running on this computer.</p>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
